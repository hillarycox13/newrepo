name: Node.js CI

on:
  push:
    branches:
      - master  # Or the branch you're working on
  pull_request:
    branches:
      - master  # Or the branch you're working on

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'  # Change this to your Node.js version

      - name: Install dependencies
        run: npm install

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Run tests
        run: npm test

